name: Daily feed

# Runs github-radar on a schedule and commits the fresh Markdown digest back
# into the repo, so the project literally publishes its own output every day.
on:
  schedule:
    # 07:13 UTC daily. Off-the-hour to avoid the top-of-hour scheduling stampede.
    - cron: "13 7 * * *"
  workflow_dispatch: {}  # allow manual runs from the Actions tab

# Needed to push the regenerated feed back to the default branch.
permissions:
  contents: write

concurrency:
  group: daily-feed
  cancel-in-progress: false

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate the daily digest
        env:
          # The built-in token raises the Search API rate limit (10 -> 30 req/min)
          # and is scoped to this repo only. It is never written to disk.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p feeds
          python -m github_radar --top 50 > feeds/latest.md

      - name: Commit the feed if it changed
        run: |
          if git diff --quiet -- feeds/latest.md; then
            echo "No change in feeds/latest.md — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/latest.md
          git commit -m "chore: daily feed $(date -u +%Y-%m-%d)"
          git push
