name: Daily GitHub project radars

on:
  schedule:
    # Runs after the extension catalogs and away from the top of the hour.
    - cron: "17 9 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "scripts/project_radar.py"
      - "github_radar/project_*.py"
      - "project_radars.json"
      - ".github/workflows/project-radars-daily.yml"
      - "tests/test_project_radar.py"
      - "docs/PROJECT_RADARS.md"

permissions:
  contents: write

concurrency:
  group: daily-github-project-radars-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect-rank-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the offline test suite
        run: python -m unittest discover -s tests

      - name: Discover, measure, rank, and render project catalogs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/project_radar.py \
            --config project_radars.json \
            --output-dir feeds/projects \
            --site-dir docs/projects

      - name: Validate the live publication bundle
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path("project_radars.json").read_text(encoding="utf-8"))
          feed_dir = Path("feeds/projects")
          status = json.loads((feed_dir / "status.json").read_text(encoding="utf-8"))
          dataset = json.loads((feed_dir / "latest.json").read_text(encoding="utf-8"))

          assert status.get("ok") is True, status
          assert dataset.get("schema_version") == 1, dataset.get("schema_version")
          assert dataset.get("count") == len(dataset.get("projects", []))
          assert dataset.get("count", 0) >= int(config["minimum_total_projects"])

          ids = [project.get("id") for project in dataset.get("projects", [])]
          names = [str(project.get("full_name", "")).lower() for project in dataset.get("projects", [])]
          assert len(ids) == len(set(ids)), "duplicate stable project IDs"
          assert len(names) == len(set(names)), "duplicate repositories"

          expected = {entry["id"] for entry in config["catalogs"]}
          actual = {entry["id"] for entry in dataset.get("catalogs", [])}
          assert expected == actual, (expected, actual)
          for catalog in config["catalogs"]:
              count = status["catalogs"].get(catalog["id"], 0)
              assert count >= int(catalog.get("minimum_items", 1)), (catalog["id"], count)
              assert (feed_dir / f"{catalog['id']}.md").exists()
              assert (feed_dir / f"{catalog['id']}.json").exists()

          assert Path("docs/projects/index.html").exists()
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("## GitHub Project Radars receipt\n\n")
              handle.write(f"- Unique projects: **{dataset['count']:,}**\n")
              handle.write(f"- Catalogs: **{len(dataset.get('catalogs', []))}**\n")
              handle.write(f"- Generated: `{dataset.get('generated_at', 'unknown')}`\n")
              handle.write(f"- History mode: **{dataset.get('history_mode', 'unknown')}**\n")
              health = status.get("source_health", {})
              handle.write(
                  f"- Sources: **{health.get('successful', 0)} successful**, "
                  f"**{health.get('failed', 0)} failed**\n"
              )
          PY

      - name: Commit generated catalogs if changed
        if: github.ref == 'refs/heads/main'
        run: |
          git add feeds/projects docs/projects
          if git diff --cached --quiet; then
            echo "No project catalog changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: daily GitHub project radars $(date -u +%Y-%m-%d)"
          git push
