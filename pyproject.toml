[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "github-radar"
version = "0.2.0"
description = "Daily momentum-aware GitHub discovery for repositories, agent extensions, and domain-specific project catalogs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Amarel Taylor Scott", email = "amarel.taylor.s@gmail.com" }]
keywords = [
    "github",
    "trending",
    "open-source",
    "repository-discovery",
    "ai",
    "llm",
    "agents",
    "mcp",
    "feed",
    "radar",
    "momentum",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Internet",
]
# Zero runtime dependencies — everything is on the Python standard library.
dependencies = []

[project.urls]
Homepage = "https://github.com/Amarel-Taylor-Scott/github-radar"
Repository = "https://github.com/Amarel-Taylor-Scott/github-radar"
Issues = "https://github.com/Amarel-Taylor-Scott/github-radar/issues"
Changelog = "https://github.com/Amarel-Taylor-Scott/github-radar/blob/main/CHANGELOG.md"

[project.scripts]
github-radar = "github_radar.cli:main"
project-radar = "github_radar.project_runner:main"

[project.optional-dependencies]
# Optional convenience tooling; production and CI use the stdlib unittest suite.
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["github_radar", "github_radar.sources"]

[tool.setuptools.package-data]
github_radar = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
